<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro de Visitas - Museu Casa do Tatuapé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#FDFBF7',
                            card: '#FFFFFF',
                            primary: '#8B4513',
                            dark: '#2C221E',
                            accent: '#D97706',
                            muted: '#786C66'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-brand-dark font-sans antialiased pb-24">

    <header class="sticky top-0 z-50 bg-brand-bg/90 backdrop-blur-md border-b border-brand-primary/10 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-brand-primary inline-block"></span>
            <span class="font-serif font-bold tracking-wide text-brand-dark text-sm uppercase">Casa do Tatuapé</span>
        </div>
        <a href="index.html" class="px-3 py-1.5 bg-brand-primary text-white rounded-full text-xs font-semibold hover:bg-brand-primary/90 transition">
            Visita Virtual
        </a>
    </header>

    <main class="max-w-md mx-auto px-4 pt-6 space-y-6">
        <div class="text-center space-y-1">
            <h1 class="font-serif text-2xl font-bold text-brand-primary">Livro de Visitas Digital</h1>
            <p class="text-xs text-brand-muted">Registre sua passagem pelo Museu Casa do Tatuapé</p>
        </div>

        <!-- Formulário -->
        <form id="guestbook-form" class="bg-brand-card p-5 rounded-2xl shadow-sm border border-stone-200/80 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-brand-dark mb-1">
                    Seu Nome <span class="text-red-600">*</span>
                </label>
                <input type="text" id="nome" required placeholder="Ex.: Maria Silva"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-brand-primary">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-brand-muted mb-1">Idade (opcional)</label>
                    <input type="number" id="idade" min="1" max="120" placeholder="Ex.: 34"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-brand-primary">
                </div>
                <div>
                    <label class="block text-xs font-medium text-brand-muted mb-1">Bairro / Cidade (opcional)</label>
                    <input type="text" id="origem" placeholder="Ex.: Tatuapé, SP"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-brand-primary">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-brand-muted mb-1">Deixe sua mensagem (opcional)</label>
                <textarea id="mensagem" rows="3" placeholder="Conte o que achou da visita ou da arquitetura..."
                    class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-brand-primary"></textarea>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full py-3 bg-brand-primary text-white font-semibold rounded-xl text-sm shadow-md hover:bg-brand-primary/90 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-feather-pointed"></i>
                <span>Assinar Livro de Visitas</span>
            </button>

            <div id="feedback" class="hidden text-center text-xs font-medium p-3 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200">
                Obrigado! Seu registro foi salvo no livro de visitas.
            </div>
        </form>

        <!-- Últimas Assinaturas Públicas -->
        <section class="space-y-3">
            <h2 class="font-serif font-semibold text-base text-brand-dark">Assinaturas Recentes</h2>
            <div id="entries-list" class="space-y-2.5"></div>
        </section>
    </main>

    <!-- Barra Inferior -->
    <nav class="fixed bottom-0 inset-x-0 bg-brand-card border-t border-stone-200/80 py-2.5 px-6 flex justify-around items-center z-50 shadow-lg">
        <a href="arquitetura.html" class="flex flex-col items-center space-y-1 text-brand-muted hover:text-brand-primary transition text-xs">
            <i class="fa-solid fa-layer-group text-lg"></i>
            <span>Arquitetura</span>
        </a>
        <a href="index.html" class="flex flex-col items-center space-y-1 text-brand-muted hover:text-brand-primary transition text-xs">
            <i class="fa-solid fa-map-location-dot text-lg"></i>
            <span>Visita Virtual</span>
        </a>
        <a href="livro-visitas.html" class="flex flex-col items-center space-y-1 text-brand-primary font-medium text-xs">
            <i class="fa-solid fa-book-open-reader text-lg"></i>
            <span>Livro Visitas</span>
        </a>
    </nav>

    <script>
        // Preencha com os dados do seu projeto Supabase (deixe vazio para teste local)
        const SUPABASE_URL = 'https://ollqdcwjgbbycximlxbe.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZFjxghQhj6k2KqGEQGbKcg_0D8TBgkF';

        async function loadEntries() {
            let entries = [];
            if (SUPABASE_URL && SUPABASE_KEY) {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/visitas?select=*&order=created_at.desc&limit=10`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                entries = await res.json();
            } else {
                entries = JSON.parse(localStorage.getItem('tatuape_visitas') || '[]').reverse().slice(0, 10);
            }

            const container = document.getElementById('entries-list');
            container.innerHTML = entries.length ? '' : '<p class="text-xs text-brand-muted">Seja o primeiro a assinar!</p>';

            entries.forEach(item => {
                const meta = [item.origem, item.idade ? `${item.idade} anos` : null].filter(Boolean).join(' • ');
                const card = document.createElement('div');
                card.className = 'bg-brand-card p-3.5 rounded-xl border border-stone-200/70 space-y-1';
                card.innerHTML = `
                    <div class="flex justify-between items-baseline">
                        <strong class="text-sm text-brand-dark">${escapeHtml(item.nome)}</strong>
                        <span class="text-[11px] text-brand-muted">${escapeHtml(meta)}</span>
                    </div>
                    ${item.mensagem ? `<p class="text-xs text-brand-dark/80 leading-relaxed">"${escapeHtml(item.mensagem)}"</p>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
        }

        document.getElementById('guestbook-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;

            const payload = {
                nome: document.getElementById('nome').value.trim(),
                idade: document.getElementById('idade').value ? parseInt(document.getElementById('idade').value, 10) : null,
                origem: document.getElementById('origem').value.trim() || null,
                mensagem: document.getElementById('mensagem').value.trim() || null
            };

            if (SUPABASE_URL && SUPABASE_KEY) {
                await fetch(`${SUPABASE_URL}/rest/v1/visitas`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(payload)
                });
            } else {
                const local = JSON.parse(localStorage.getItem('tatuape_visitas') || '[]');
                local.push({ ...payload, created_at: new Date().toISOString() });
                localStorage.setItem('tatuape_visitas', JSON.stringify(local));
            }

            e.target.reset();
            btn.disabled = false;
            const fb = document.getElementById('feedback');
            fb.classList.remove('hidden');
            setTimeout(() => fb.classList.add('hidden'), 4000);
            loadEntries();
        });

        loadEntries();
    </script>
</body>
</html>
